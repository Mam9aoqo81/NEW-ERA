name: Application checks
on:
  push:
    branches: [main, 'arena/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      KNOWLM_YOUTUBE_FETCH_ENABLED: '0'
      KNOWLM_LLM_ENABLED: '0'
      KNOWLM_EMBEDDINGS_ENABLED: '0'
      KNOWLM_OCR_ENABLED: '0'
      KNOWLM_TTS_ENABLED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements.lock.txt -r backend/requirements-ocr.txt -r backend/requirements-audio.txt
          npm ci --prefix frontend
      - name: Install and verify optional OCR models
        run: python -m knowlm.ocr_models --directory "$RUNNER_TEMP/tessdata"
      - name: Backend, migrations and real local OCR tests
        run: |
          KNOWLM_TEST_OCR_DATA_PATH="$RUNNER_TEMP/tessdata" python -m pytest -q backend/tests
          DATABASE_URL="sqlite:///$RUNNER_TEMP/schema.db" python -m alembic upgrade head
          DATABASE_URL="sqlite:///$RUNNER_TEMP/schema.db" python -m alembic check
          python -m pip check
      - name: Frontend tests, formatting, build and dependency audit
        run: |
          npm test --prefix frontend
          npm run format:check --prefix frontend
          npm run build --prefix frontend
          npm audit --prefix frontend --audit-level=high
